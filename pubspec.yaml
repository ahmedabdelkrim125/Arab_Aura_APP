name: arab_ora_app
description: "Arab Aura App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Zanjabeel
      fonts:
        - asset: assets/fonts/zanjabeel-black.otf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf